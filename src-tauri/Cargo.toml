[package]
name = "daemoncore"
version = "0.1.0"
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
daemoncore-ntfs-core = { path = "../ntfs-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
png = "=0.17.16"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg"] }
crc32fast = "=1.5.2"
rfd = "0.15"
